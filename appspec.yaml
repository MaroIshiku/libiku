{
  "schema_version": 1,
  "application": {
    "id": "libiku",
    "name": "Libiku",
    "family": "ishiku",
    "locale": "en"
  },
  "summary": "Operate supported Libation scan, library, download, login, and import workflows through a self-hosted interface.",
  "requirements": [
    {
      "id": "CORE-001",
      "title": "Core product behavior",
      "priority": "critical",
      "acceptance": [
        "Operate supported Libation scan, library, download, login, and import workflows through a self-hosted interface.",
        "Existing documented and reachable behavior remains available unless an approved migration decision says otherwise."
      ],
      "security_critical": false
    },
    {
      "id": "AUTH-001",
      "title": "Secure account access",
      "priority": "critical",
      "acceptance": [
        "Account authentication uses generic errors, rate limits, and a supported password hash.",
        "Sessions are server-side revocable, rotated, time-bounded, cookie-protected, and CSRF-protected."
      ],
      "security_critical": true
    },
    {
      "id": "CORE-002",
      "title": "Queued audiobook downloads",
      "priority": "high",
      "acceptance": [
        "An admin can enqueue multiple individual audiobook downloads without waiting for the current download to finish.",
        "Downloads run one at a time in first-in, first-out order, duplicate active entries are rejected, and queue progress remains visible after page refresh.",
        "Queued downloads remain mutually exclusive with scan, import, bulk download, and Amazon account connection jobs."
      ],
      "security_critical": false
    },
    {
      "id": "ACCOUNT-001",
      "title": "Reliable Amazon account connection",
      "priority": "critical",
      "acceptance": [
        "An admin can choose the Audible marketplace, receive the one-time Amazon sign-in link, and submit the final browser response URL to the same live Libation login session.",
        "The interface explains where the response URL comes from, survives page refresh while the server session is live, and provides clear success, failure, cancellation, and expiry recovery.",
        "Amazon credentials are entered only on Amazon; response URLs require a trusted HTTPS Amazon or Audible host and are not persisted, logged, or exposed through process arguments."
      ],
      "security_critical": true
    },
    {
      "id": "COMMAND-001",
      "title": "Libation command window",
      "priority": "high",
      "acceptance": [
        "An admin can run supported Libation commands from the dashboard and read their job output and exit status.",
        "Command submission requires an admin session and rejects cross-site requests, unknown commands, and unsupported arguments.",
        "Downloads use the existing job queue and interactive Amazon login uses the guided sign-in flow."
      ],
      "security_critical": true
    },
    {
      "id": "UI-001",
      "title": "Consistent English interface",
      "priority": "high",
      "acceptance": [
        "All user-facing interface text is English.",
        "The app uses ishiku semantic tokens, shared layout contracts, responsive behavior, and WCAG 2.2 AA interaction."
      ],
      "security_critical": false
    },
    {
      "id": "OPS-001",
      "title": "Safe standalone operation",
      "priority": "high",
      "acceptance": [
        "A fresh clone can build, test, and run without the outer workspace.",
        "Health checks, persistent data, runtime secrets, backup, restore, and upgrade procedures are verifiable."
      ],
      "security_critical": true
    },
    {
      "id": "REL-001",
      "title": "Reproducible release",
      "priority": "high",
      "acceptance": [
        "Pull requests and releases use clone-local verification scripts.",
        "Released images are immutable, scanned, SBOM-equipped, provenance-attested, and rollback-documented."
      ],
      "security_critical": true
    }
  ]
}

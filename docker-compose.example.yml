name: libiku

services:
  libiku:
    image: ${LIBIKU_IMAGE:-ghcr.io/maroishiku/libiku:0.1.0}
    pull_policy: always
    container_name: libiku
    hostname: libiku
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    environment:
      TZ: Europe/Berlin
      PORT: 3000
      ISHIKU_SETUP_SECRET_FILE: /run/secrets/ishiku_setup_secret
      LIBIKU_AUTH_FILE: /config/LibikuAuth.json
      LIBATION_FILES_DIR: /config
      LIBATION_CONFIG_DIR: /config
      LIBATION_DB_DIR: /db
      LIBATION_DB_FILE: ""
      LIBATION_BOOKS_DIR: /data
      PUBLIC_IP_URL: https://api.ipify.org?format=json
      PUBLIC_IP_INTERVAL_SECONDS: 300
      NODE_ENV: production
    secrets:
      - ishiku_setup_secret
    volumes:
      - type: bind
        source: /DATA/AppData/libiku/config
        target: /config
      - type: bind
        source: /DATA/AppData/libiku/db
        target: /db
      - type: bind
        source: /DATA/AppData/libiku/data
        target: /data
    ports:
      - "3100:3000/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  ishiku_setup_secret:
    file: ./secrets/setup_secret.txt

x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/libiku/main/public/assets/logos/libiku.png
  index: /
  is_uncontrolled: false
  port_map: "3100"
  scheme: http
  store_app_id: libiku
  title:
    custom: Libiku
    en_us: Libiku
